[alembic]
script_location = alembic
# env.py does `from app.config import settings`, which needs backend/ on sys.path.
prepend_sys_path = .
sqlalchemy.url = postgresql://klygenix_video:klygenix_video@localhost:25436/klygenix_video

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
