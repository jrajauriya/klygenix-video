<svg width="1885" height="621" viewBox="0 0 1885 621" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Klygenix">
  <!-- Klygenix lockup, light ground.
       Letters: Royal Indigo ramp #1E1B4B -> #632B4F -> #B44A32, vertical,
       dark at the foot, tied to the word's own ink box.
       Sparkle: #0E9BC4 to #7C3AED on the diagonal, r 88 at
       x 300.5, bigger than the icon's and re-centred between the
       K and the l, so it has more room at the tight end, not less.
       The K is NOT repeated: the icon's K is the word's first letter. The string
       is set from x=100 with natural advances, so the K lands where the icon has
       it and the sparkle is unmoved, falling in the K-to-l gap with 10.3 units
       to spare. Only the sparkle carries over, not the whole ix: the i bar
       would sit hard against the l and read as a phantom letter.
       Second line: cap 90.0 (30% of the name), tracked
       +0.300 em, width 1170 of the name's 1885 (clamped: an exact match wanted +1.022 em).
       Leading is measured from the g's descender at 117.5 below the
       baseline, not from the baseline, or it would sit under the descenders.
       Canvas is the true ink box: the i's tittle rises above the cap line and the
       g drops below the baseline, so neither is clipped.
       Poppins Bold outlined. This face carries no kern feature at all, so plain
       advance widths are correct; nothing was approximated.
       No text element anywhere. -->
