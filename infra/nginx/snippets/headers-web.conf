include /etc/nginx/snippets/security-common.conf;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), autoplay=(self \"https://www.youtube-nocookie.com\" \"https://player.bilibili.com\"), fullscreen=(self \"https://www.youtube-nocookie.com\" \"https://player.bilibili.com\"), payment=(self \"https://checkout.razorpay.com\" \"https://api.razorpay.com\")" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' https://api.${PUBLIC_DOMAIN}${PUBLIC_PORT} wss://api.${PUBLIC_DOMAIN}${PUBLIC_PORT} https://*.b-cdn.net https://api.razorpay.com https://lumberjack.razorpay.com $kv_csp_connect_extra; worker-src 'self' blob:; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://player.bilibili.com https://api.razorpay.com https://checkout.razorpay.com; object-src 'none'; base-uri 'self'; form-action 'self' https://api.razorpay.com; frame-ancestors 'none'; upgrade-insecure-requests" always;
