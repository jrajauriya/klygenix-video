global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    service: klygenix-video

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: klygenix-video-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ["backend:9300"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  - job_name: blackbox
    metrics_path: /probe
    scrape_interval: 60s
    scrape_timeout: 15s
    static_configs:
      - targets: ["https://play.klygenix.com/"]
        labels: {probe: web, __param_module: http_shell}
      - targets: ["https://play.klygenix.com/reels"]
        labels: {probe: reels, __param_module: http_shell}
      - targets: ["https://api.play.klygenix.com/api/video/render?path=/"]
        labels: {probe: render, __param_module: http_shell}
      - targets: ["https://api.play.klygenix.com/health"]
        labels: {probe: api-health, __param_module: http_health}
      - targets: ["https://studio.play.klygenix.com/login"]
        labels: {probe: studio, __param_module: http_app}
      - targets: ["https://admin.play.klygenix.com/login"]
        labels: {probe: admin, __param_module: http_app}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
