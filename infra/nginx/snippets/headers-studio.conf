include /etc/nginx/snippets/security-common.conf;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=(self \"https://checkout.razorpay.com\" \"https://api.razorpay.com\")" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' https: data: blob:; media-src 'self' https: blob:; worker-src 'self' blob:; connect-src 'self' https://${API_HOST}${PUBLIC_PORT} https://video.bunnycdn.com https://*.b-cdn.net https://api.razorpay.com https://lumberjack.razorpay.com $kv_csp_connect_extra; frame-src https:; object-src 'none'; base-uri 'self'; form-action 'self' https://api.razorpay.com; frame-ancestors 'none'; upgrade-insecure-requests" always;
