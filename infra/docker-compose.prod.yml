services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: klygenix-video-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    entrypoint: ["sh", "-c", "chown postgres:postgres /wal-archive /backups && exec docker-entrypoint.sh \"$$@\"", "--"]
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=300
      - -c
      - archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${KV_BACKUP_ROOT:-/opt/klygenix-video/backups}/wal:/wal-archive
      - ${KV_BACKUP_ROOT:-/opt/klygenix-video/backups}/base:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: klygenix-video-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args: { SENTRY_RELEASE: "${SENTRY_RELEASE:-}" }
    image: klygenix-video-backend:current
    container_name: klygenix-video-backend
    restart: unless-stopped
    env_file: [../backend/.env.prod]
    environment:
      FORWARDED_ALLOW_IPS: "*"
      JOBS_MODE: rq
      LIVE_WORKER_INLINE: "false"
      WEB_CONCURRENCY: "${KV_API_WORKERS:-4}"
      DB_POOL_SIZE: "${KV_API_DB_POOL:-6}"
      DB_MAX_OVERFLOW: "${KV_API_DB_OVERFLOW:-6}"
      WEB_INDEX_PATH: /app/web/index.html
    volumes:
      - ../backend/.secret.key:/app/.secret.key:ro
      - ../apps/web/dist:/app/web:ro
      - media:/app/private_uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9300/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker-ai:
    image: klygenix-video-backend:current
    container_name: klygenix-video-worker-ai
    restart: unless-stopped
    command: ["rq", "worker", "--url", "${REDIS_URL}", "-c", "app.video.jobs.rq_boot", "ai", "default"]
    env_file: [../backend/.env.prod]
    environment:
      JOBS_MODE: rq
    volumes:
      - ../backend/.secret.key:/app/.secret.key:ro
      - media:/app/private_uploads
    depends_on:
      backend: { condition: service_healthy }

  worker-render:
    image: klygenix-video-backend:current
    container_name: klygenix-video-worker-render
    restart: unless-stopped
    command: ["rq", "worker", "--url", "${REDIS_URL}", "-c", "app.video.jobs.rq_boot", "render"]
    env_file: [../backend/.env.prod]
    environment:
      JOBS_MODE: rq
    volumes:
      - ../backend/.secret.key:/app/.secret.key:ro
      - media:/app/private_uploads
    cpus: "${KV_RENDER_CPUS:-2.0}"
    depends_on:
      backend: { condition: service_healthy }

  scheduler:
    image: klygenix-video-backend:current
    container_name: klygenix-video-scheduler
    restart: unless-stopped
    command: ["python", "-m", "app.video.jobs.scheduler"]
    env_file: [../backend/.env.prod]
    environment:
      JOBS_MODE: rq
    volumes:
      - ../backend/.secret.key:/app/.secret.key:ro
    depends_on:
      backend: { condition: service_healthy }

  live:
    image: klygenix-video-backend:current
    container_name: klygenix-video-live
    profiles: ["sandbox-live"]
    restart: unless-stopped
    command: ["python", "-m", "app.video.live.worker"]
    env_file: [../backend/.env.prod]
    environment:
      JOBS_MODE: rq
      LIVE_WORKER_INLINE: "false"
      LIVE_GATE_BIND: "0.0.0.0"
    ports:
      - "${LIVE_RTMP_BIND:-127.0.0.1}:${LIVE_RTMP_PORTS:-19350-19359}:${LIVE_RTMP_PORTS:-19350-19359}"
    volumes:
      - ../backend/.secret.key:/app/.secret.key:ro
      - media:/app/private_uploads
    depends_on:
      backend: { condition: service_healthy }

  nginx:
    image: nginx:1.30-alpine
    container_name: klygenix-video-nginx
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-play.klygenix.com}
      PUBLIC_PORT: ${PUBLIC_PORT:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
    command: ["sh", "/etc/nginx/render.sh"]
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/render.sh:/etc/nginx/render.sh:ro
      - ./nginx/applinks.sh:/etc/nginx/applinks.sh:ro
      - ./nginx/prod.conf.template:/etc/nginx/prod.conf.template:ro
      - ./nginx/snippets:/etc/nginx/snippet-templates:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ../apps/web/dist:/var/www/web:ro
      - ../apps/admin/dist:/var/www/admin:ro
      - ../apps/studio/dist:/var/www/studio:ro
      - ../apps/tv/dist:/var/www/tv:ro
    depends_on:
      backend: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  media:
