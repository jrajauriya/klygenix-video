# Public images: content-hashed, so cached for a year at the edge and in the browser; already compressed.
gzip off;
proxy_pass http://$kv_backend;
include /etc/nginx/snippets/proxy-backend.conf;
proxy_cache kv_media;
proxy_cache_key $request_uri;
proxy_cache_valid 200 30d;
proxy_cache_valid 404 1m;
proxy_cache_lock on;
proxy_cache_lock_timeout 15s;
proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
proxy_ignore_headers Set-Cookie Vary;
proxy_hide_header Cache-Control;
include /etc/nginx/snippets/headers-api.conf;
add_header Cache-Control "public, max-age=31536000, immutable";
add_header X-Cache-Status $upstream_cache_status always;
